version: "3.8"

services:
  dashboard-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dyson-network
    restart: unless-stopped

  dashboard-prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dyson-network
    restart: unless-stopped
    profiles:
      - production

networks:
  dyson-network:
